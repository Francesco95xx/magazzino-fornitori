name: Aggiorna magazzino fornitori

on:
  schedule:
    # 03:00 UTC ~= 04:00/05:00 ora italiana a seconda dell'ora legale
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: scrape-fornitori
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze scraper
        working-directory: scraper
        run: npm ci

      - name: Installa Chromium per Playwright
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Esegui scraper
        working-directory: scraper
        run: node run-all.js
        continue-on-error: true # uno scraper fallito non deve bloccare il commit dei dati buoni
        env:
          MARIMAR_API_TOKEN: ${{ secrets.MARIMAR_API_TOKEN }}

      - name: Commit dati aggiornati (se cambiati)
        run: |
          git config user.name "magazzino-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fornitori.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati, niente da committare."
          else
            git commit -m "Aggiornamento automatico magazzino fornitori $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

name: Aggiorna magazzino fornitori

on:
  schedule:
    # 03:00 UTC ~= 04:00/05:00 ora italiana a seconda dell'ora legale
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: scrape-fornitori
  cancel-in-progress: false

jobs:
  scrape:
    # Runner self-hosted su PC dell'utente (non ubuntu-latest): alcuni siti
    # fornitore (es. Marimar/interagisco.it) bloccano le richieste dai range
    # IP dei datacenter cloud (GitHub-hosted runner) con un secco 403, ma
    # rispondono normalmente da una connessione "normale" come questa.
    runs-on: [self-hosted, windows, cadoro-pc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze scraper
        working-directory: scraper
        run: npm ci

      - name: Installa Chromium per Playwright
        working-directory: scraper
        run: npx playwright install chromium

      - name: Esegui scraper
        working-directory: scraper
        run: node run-all.js
        continue-on-error: true # uno scraper fallito non deve bloccare il commit dei dati buoni
        env:
          MARIMAR_API_TOKEN: ${{ secrets.MARIMAR_API_TOKEN }}

      - name: Commit dati aggiornati (se cambiati)
        shell: powershell # Windows PowerShell 5.1: pwsh (PS7) non è installato su questo runner
        run: |
          git config user.name "magazzino-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fornitori.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Nessuna modifica ai dati, niente da committare."
          } else {
            $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            git commit -m "Aggiornamento automatico magazzino fornitori $timestamp"
            git push
          }
